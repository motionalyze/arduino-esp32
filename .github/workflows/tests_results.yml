name: Publish and clean test results

on:
  workflow_run:
    workflows: ["Wokwi tests"]
    types: [completed]
  workflow_dispatch:
    inputs:
      upstream_run_id:
        description: "Run ID of the 'Wokwi tests' workflow to pull artifacts from"
        required: true
        type: string

permissions: { contents: read }

jobs:
  unit-test-results:
    name: Unit Test Results
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success' ||
      github.event.workflow_run.conclusion == 'failure' ||
      github.event.workflow_run.conclusion == 'timed_out'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      checks: write
      pull-requests: write
      contents: write

    env:
      UPSTREAM_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.upstream_run_id }}

    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: gh-pages

      - name: Download and Extract Artifacts
        uses: dawidd6/action-download-artifact@07ab29fd4a977ae4d2b275087cf67563dfdf0295
        with:
          run_id: ${{ env.UPSTREAM_RUN_ID }}
          path: ./artifacts

      - name: Get original info
        shell: bash
        run: |
          if [ ! -f ./artifacts/parent-artifacts/sha.txt ]; then
            echo "Parent artifacts not found (did you pass a correct 'upstream_run_id'?)."
            ls -la ./artifacts || true
            # continue, we just won't set statuses or fail the job
          fi

          original_event=$(cat ./artifacts/parent-artifacts/event.txt 2>/dev/null || echo "")
          original_action=$(cat ./artifacts/parent-artifacts/action.txt 2>/dev/null || echo "")
          original_sha=$(cat ./artifacts/parent-artifacts/sha.txt 2>/dev/null || echo "")
          original_ref=$(cat ./artifacts/parent-artifacts/ref.txt 2>/dev/null || echo "")
          original_conclusion=$(cat ./artifacts/parent-artifacts/conclusion.txt 2>/dev/null || echo "")
          original_run_id=$(cat ./artifacts/parent-artifacts/run_id.txt 2>/dev/null || echo "")

          original_event=$(echo "$original_event" | tr -cd '[:alpha:]_')
          original_action=$(echo "$original_action" | tr -cd '[:alpha:]_')
          original_sha=$(echo "$original_sha" | tr -cd '[:alnum:]')
          original_ref=$(echo "$original_ref" | tr -cd '[:alnum:]/_.-')
          original_conclusion=$(echo "$original_conclusion" | tr -cd '[:alpha:]_')
          original_run_id=$(echo "$original_run_id" | tr -cd '[:digit:]')

          echo "original_event=$original_event" >> $GITHUB_ENV
          echo "original_action=$original_action" >> $GITHUB_ENV
          echo "original_sha=$original_sha" >> $GITHUB_ENV
          echo "original_ref=$original_ref" >> $GITHUB_ENV
          echo "original_conclusion=$original_conclusion" >> $GITHUB_ENV
          echo "original_run_id=$original_run_id" >> $GITHUB_ENV

          echo "original_event = $original_event"
          echo "original_action = $original_action"
          echo "original_sha = $original_sha"
          echo "original_ref = $original_ref"
          echo "original_conclusion = $original_conclusion"
          echo "original_run_id = $original_run_id"

      - name: Print links to other runs
        shell: bash
        run: |
          echo "Build, Hardware and QEMU tests: https://github.com/${{ github.repository }}/actions/runs/${{ env.original_run_id }}"
          echo "Wokwi tests: https://github.com/${{ github.repository }}/actions/runs/${{ env.UPSTREAM_RUN_ID }}"

      - name: Publish Unit Test Results
        uses: EnricoMi/publish-unit-test-result-action@170bf24d20d201b842d7a52403b73ed297e6645b
        with:
          commit: ${{ env.original_sha }}
          event_file: ./artifacts/parent-artifacts/event_file/event.json
          event_name: ${{ env.original_event }}
          files: ./artifacts/**/*.xml
          action_fail: false               # do NOT fail the job
          compare_to_earlier_commit: false
          json_file: ./unity_results.json
          json_suite_details: true

      - name: Upload JSON
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: unity_results
          overwrite: true
          path: ./unity_results.json

      # no 'Fail if tests failed' step anymore

      - name: Clean up caches
        if: always()
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        with:
          script: |
            const ref = process.env.original_ref;
            const key_prefix = ref ? ('tests-' + ref + '-') : null;

            if (process.env.original_event == 'pull_request' && process.env.original_action != 'closed') {
              console.log('Skipping cache cleanup for open PR');
              return;
            }
            if (!key_prefix) {
              console.log('No ref available, skipping cache cleanup.');
              return;
            }

            const caches = await github.paginate(github.rest.actions.getActionsCacheList, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
              key: key_prefix
            });

            if (caches && caches.length) {
              for (const cache of caches) {
                console.log(`Deleting cache: ${cache.key}`);
                await github.rest.actions.deleteActionsCacheById({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  cache_id: cache.id
                });
              }
            } else {
              console.log('No caches matched the key prefix.');
            }

      # removed: Report conclusion (commit status) step

      - name: Generate report
        if: ${{ !cancelled() && (env.original_event == 'schedule' || env.original_event == 'workflow_dispatch') }}
        env:
          REPORT_FILE: ./runtime-tests-results/RUNTIME_TESTS_REPORT.md
          WOKWI_RUN_ID: ${{ env.UPSTREAM_RUN_ID }}
          BUILD_RUN_ID: ${{ env.original_run_id }}
          IS_FAILING: ${{ env.original_conclusion == 'failure' || env.original_conclusion == 'timed_out' || github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'timed_out' || job.status == 'failure' }}
        run: |
          rm -rf artifacts $REPORT_FILE
          mv -f ./unity_results.json ./runtime-tests-results/unity_results.json
          mkdir -p runtime-tests-results
          : > $REPORT_FILE
          python3 ./runtime-tests-results/table_generator.py ./runtime-tests-results/unity_results.json >> $REPORT_FILE

      - name: Generate badge
        if: ${{ !cancelled() && (env.original_event == 'schedule' || env.original_event == 'workflow_dispatch') }}
        uses: jaywcjlove/generated-badges@0e078ae4d4bab3777ea4f137de496ab44688f5ad
        with:
          label: Runtime Tests
          status: ${{ job.status == 'success' && 'passing' || 'failing' }}
          output: runtime-tests-results/badge.svg
          color: ${{ job.status == 'success' && 'green' || 'red' }}
          style: flat

      - name: Push badge
        if: ${{ !cancelled() && (env.original_event == 'schedule' || env.original_event == 'workflow_dispatch') }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -n "$(git status --porcelain)" ]]; then
            git add --all
            git commit -m "Updated runtime tests report"
            git push origin HEAD:gh-pages
          else
            echo "Nothing to commit."
          fi
