name: Publish test results (artifact only)

on:
  # Run automatically after Wokwi tests complete
  workflow_run:
    workflows: ["Wokwi tests"]
    types: [completed]

  # Allow manual runs via UI/CLI
  workflow_dispatch:
    inputs:
      upstream_run_id:
        description: "Run ID of the 'Wokwi tests' workflow to pull artifacts from"
        required: true
        type: string

permissions:
  contents: read  # minimal; no pushes, no statuses

jobs:
  publish-artifacts:
    name: Publish test results
    runs-on: ubuntu-latest

    # Allow manual runs always; on workflow_run, only run for these outcomes
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success' ||
      github.event.workflow_run.conclusion == 'failure' ||
      github.event.workflow_run.conclusion == 'timed_out'

    # Unified upstream run ID
    env:
      UPSTREAM_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.upstream_run_id }}

    steps:
      - name: Download artifacts from upstream run
        uses: dawidd6/action-download-artifact@07ab29fd4a977ae4d2b275087cf67563dfdf0295 # v9
        with:
          run_id: ${{ env.UPSTREAM_RUN_ID }}
          path: ./artifacts

      - name: Echo artifact tree (for debugging)
        run: |
          echo "Downloaded artifacts from run $UPSTREAM_RUN_ID:"
          ls -laR ./artifacts || true

      # Optional: publish the combined JSON if it exists in your artifacts
      - name: Upload unity_results.json (if present)
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unity_results
          overwrite: true
          path: |
            ./artifacts/**/unity_results.json
          if-no-files-found: warn

      # Optional: re-upload all raw XML/JUnit files so you have them attached to this run
      - name: Upload raw JUnit XMLs (if present)
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: junit_xml
          overwrite: true
          path: |
            ./artifacts/**/*.xml
          if-no-files-found: warn
